<!-- CSS.html — Global Stylesheet untuk semua halaman AMSP -->
<style>
  /* ─── GOOGLE FONTS ─── */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  /* ─── RESET & BASE ─── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary:       #1a56db;
    --primary-dark:  #1141a8;
    --primary-light: #e8f0fe;
    --secondary:     #0ea5e9;
    --success:       #10b981;
    --warning:       #f59e0b;
    --danger:        #ef4444;
    --info:          #6366f1;

    --bg:            #f0f4f8;
    --bg-card:       #ffffff;
    --sidebar-bg:    #0f172a;
    --sidebar-text:  #94a3b8;
    --sidebar-hover: rgba(255,255,255,0.08);
    --sidebar-active:#1a56db;

    --text:          #1e293b;
    --text-muted:    #64748b;
    --border:        #e2e8f0;
    --shadow:        0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
    --shadow-md:     0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.05);
    --shadow-lg:     0 10px 15px rgba(0,0,0,.1), 0 4px 6px rgba(0,0,0,.05);
    --radius:        10px;
    --radius-sm:     6px;
    --transition:    all .2s ease;
  }

  html, body {
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── SCROLLBAR ─── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* ─── LAYOUT UTAMA ─── */
  .app-layout {
    display: flex;
    min-height: 100vh;
  }

  /* ─── SIDEBAR ─── */
  .sidebar {
    width: 240px;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 100;
    transition: var(--transition);
    overflow-y: auto;
  }

  .sidebar-brand {
    padding: 16px 18px;
    border-bottom: 1px solid rgba(255,255,255,.07);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .sidebar-brand .brand-logo-img {
    width: 38px;
    height: 38px;
    object-fit: contain;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.25));
  }
  .sidebar-brand .brand-name {
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -.5px;
    line-height: 1.1;
  }
  .sidebar-brand .brand-sub {
    font-size: 9.5px;
    color: #93c5fd;
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: .5px;
    font-weight: 600;
  }

  .sidebar-user {
    padding: 14px 20px;
    background: rgba(255,255,255,.04);
    margin: 12px 12px 4px;
    border-radius: var(--radius-sm);
  }
  .sidebar-user .user-name {
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sidebar-user .user-role {
    font-size: 11px;
    color: var(--sidebar-text);
    margin-top: 2px;
  }
  .sidebar-user .user-avatar {
    width: 36px;
    height: 36px;
    background: var(--primary);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    margin-bottom: 8px;
  }

  .sidebar-nav {
    flex: 1;
    padding: 8px 12px;
  }
  .nav-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(148,163,184,.5);
    padding: 12px 8px 4px;
    font-weight: 600;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    color: var(--sidebar-text);
    cursor: pointer;
    transition: var(--transition);
    font-size: 13.5px;
    font-weight: 500;
    user-select: none;
    margin-bottom: 2px;
    text-decoration: none;
  }
  .nav-item:hover {
    background: var(--sidebar-hover);
    color: #fff;
  }
  .nav-item.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 2px 8px rgba(26,86,219,.4);
  }
  .nav-item .nav-icon {
    font-size: 17px;
    flex-shrink: 0;
    width: 20px;
    text-align: center;
  }
  .nav-badge {
    margin-left: auto;
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 20px;
    min-width: 18px;
    text-align: center;
  }

  .sidebar-footer {
    padding: 12px;
    border-top: 1px solid rgba(255,255,255,.07);
  }
  .btn-logout {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 9px 12px;
    background: rgba(239,68,68,.15);
    color: #fca5a5;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: var(--transition);
    font-family: inherit;
  }
  .btn-logout:hover {
    background: rgba(239,68,68,.3);
    color: #fecaca;
  }

  /* ─── MAIN CONTENT ─── */
  .main-content {
    margin-left: 240px;
    flex: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ─── TOP NAV ─── */
  .topnav {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: var(--shadow);
  }
  .topnav-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }
  .topnav-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topnav-clock {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f8fafc;
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    user-select: none;
    transition: var(--transition);
  }
  .topnav-clock:hover {
    background: #f1f5f9;
    border-color: #cbd5e1;
  }
  .clock-icon {
    font-size: 14px;
    line-height: 1;
    display: inline-block;
    animation: pulseClock 2s infinite ease-in-out;
  }
  @keyframes pulseClock {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.65; transform: scale(1.08); }
  }
  .clock-date {
    font-weight: 600;
    color: var(--text);
  }
  .clock-divider {
    color: #cbd5e1;
    font-weight: 300;
  }
  .clock-time {
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 0.5px;
  }
  @media (max-width: 640px) {
    .clock-date, .clock-divider { display: none; }
    .topnav-clock { padding: 4px 8px; }
  }
  .notif-btn {
    position: relative;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 20px;
    color: var(--text-muted);
    transition: var(--transition);
    padding: 6px;
    border-radius: var(--radius-sm);
  }
  .notif-btn:hover { background: var(--bg); color: var(--primary); }
  .notif-badge {
    position: absolute;
    top: 2px; right: 2px;
    width: 8px; height: 8px;
    background: var(--danger);
    border-radius: 50%;
    border: 2px solid #fff;
  }

  /* ─── PAGE CONTENT ─── */
  .page-content {
    padding: 24px;
    flex: 1;
  }
  .page-header {
    margin-bottom: 20px;
  }
  .page-header h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }
  .page-header p {
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 3px;
  }

  /* ─── STAT CARDS ─── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 16px;
    border: 1px solid var(--border);
    transition: var(--transition);
  }
  .stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .stat-icon {
    width: 48px;
    height: 48px;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .stat-icon.blue   { background: #eff6ff; }
  .stat-icon.green  { background: #f0fdf4; }
  .stat-icon.orange { background: #fff7ed; }
  .stat-icon.purple { background: #faf5ff; }
  .stat-icon.red    { background: #fef2f2; }
  .stat-icon.teal   { background: #f0fdfa; }
  .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .stat-value { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1; margin-top: 2px; }

  /* ─── CARD ─── */
  .card {
    background: var(--bg-card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }
  .card-body {
    padding: 20px;
  }

  /* ─── TABLE ─── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: #f8fafc; }
  thead th {
    padding: 11px 14px;
    text-align: left;
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-muted);
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }
  tbody tr {
    border-bottom: 1px solid #f1f5f9;
    transition: var(--transition);
  }
  tbody tr:hover { background: #f8fafc; }
  tbody td {
    padding: 12px 14px;
    font-size: 13px;
    color: var(--text);
    vertical-align: middle;
  }
  tbody tr:last-child { border-bottom: none; }

  /* ─── BADGE ─── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge-draft     { background: #f1f5f9; color: #64748b; }
  .badge-verifikasi{ background: #fff7ed; color: #d97706; }
  .badge-disetujui { background: #f0fdf4; color: #16a34a; }
  .badge-arsip     { background: #eff6ff; color: #2563eb; }
  .badge-masuk     { background: #faf5ff; color: #7c3aed; }
  .badge-keluar    { background: #fff7ed; color: #c2410c; }
  .badge-permohonan{ background: #f0fdf4; color: #047857; }
  .badge-pending   { background: #fff7ed; color: #b45309; }
  .badge-approved  { background: #f0fdf4; color: #15803d; }
  .badge-rejected  { background: #fef2f2; color: #b91c1c; }
  .badge-Admin     { background: #eff6ff; color: #1d4ed8; }
  .badge-Pimpinan  { background: #fdf4ff; color: #7e22ce; }
  .badge-Pegawai   { background: #f0fdf4; color: #166534; }

  /* ─── BUTTONS ─── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: var(--transition);
    font-family: inherit;
    white-space: nowrap;
    text-decoration: none;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); box-shadow: 0 2px 8px rgba(26,86,219,.3); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { background: #059669; }
  .btn-warning { background: var(--warning); color: #fff; }
  .btn-warning:hover { background: #d97706; }
  .btn-danger  { background: var(--danger); color: #fff; }
  .btn-danger:hover  { background: #dc2626; }
  .btn-outline {
    background: transparent;
    color: var(--primary);
    border: 1.5px solid var(--primary);
  }
  .btn-outline:hover { background: var(--primary-light); }
  .btn-ghost {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: #e2e8f0; }
  .btn-sm { padding: 5px 11px; font-size: 12px; }
  .btn-xs { padding: 3px 8px; font-size: 11px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ─── FORMS ─── */
  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .form-control {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    transition: var(--transition);
    outline: none;
  }
  .form-control:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(26,86,219,.1);
  }
  textarea.form-control { resize: vertical; min-height: 100px; }
  select.form-control { cursor: pointer; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-text { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }

  /* ─── SEARCH BAR ─── */
  .search-wrap {
    position: relative;
    flex: 1;
    max-width: 320px;
  }
  .search-wrap .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 15px;
  }
  .search-wrap input {
    width: 100%;
    padding: 8px 12px 8px 34px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: var(--transition);
    background: #fff;
  }
  .search-wrap input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(26,86,219,.1);
  }

  /* ─── MODAL ─── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: var(--transition);
    backdrop-filter: blur(2px);
  }
  .modal-overlay.show { opacity: 1; visibility: visible; }
  .modal {
    background: #fff;
    border-radius: 14px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
    transform: scale(.95);
    transition: var(--transition);
  }
  .modal-overlay.show .modal { transform: scale(1); }
  .modal-lg { max-width: 760px; }
  .modal-header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title { font-size: 16px; font-weight: 700; color: var(--text); }
  .modal-close {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: var(--text-muted);
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
    transition: var(--transition);
  }
  .modal-close:hover { background: var(--bg); color: var(--text); }
  .modal-body { padding: 22px; }
  .modal-footer {
    padding: 14px 22px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  /* ─── ALERT / TOAST ─── */
  .toast-container {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 360px;
  }
  .toast {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: #fff;
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.15);
    border-left: 4px solid;
    animation: toastIn .3s ease;
  }
  .toast.success { border-color: var(--success); }
  .toast.error   { border-color: var(--danger); }
  .toast.warning { border-color: var(--warning); }
  .toast.info    { border-color: var(--info); }
  .toast-icon    { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .toast-msg     { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.4; flex: 1; }
  @keyframes toastIn {
    from { transform: translateX(100%); opacity: 0; }
    to   { transform: translateX(0);    opacity: 1; }
  }

  /* ─── EMPTY STATE ─── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 14px; opacity: .5; }
  .empty-state h3 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .empty-state p  { font-size: 13px; }

  /* ─── LOADING ─── */
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto;
  }
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,.8);
    z-index: 9998;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    opacity: 0;
    visibility: hidden;
    transition: var(--transition);
    backdrop-filter: blur(2px);
  }
  .loading-overlay.show { opacity: 1; visibility: visible; }
  .loading-text { font-size: 14px; color: var(--text-muted); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── NOTIFIKASI PANEL ─── */
  .notif-panel {
    position: fixed;
    top: 60px; right: 0;
    width: 340px;
    background: #fff;
    border-left: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    z-index: 200;
    max-height: calc(100vh - 60px);
    overflow-y: auto;
    transform: translateX(100%);
    transition: var(--transition);
    border-radius: 0 0 0 var(--radius);
  }
  .notif-panel.open { transform: translateX(0); }
  .notif-panel-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .notif-panel-title { font-weight: 700; font-size: 14px; }
  .notif-item {
    padding: 13px 16px;
    border-bottom: 1px solid #f1f5f9;
    cursor: pointer;
    transition: var(--transition);
  }
  .notif-item:hover { background: #f8fafc; }
  .notif-item.unread { background: #eff6ff; }
  .notif-item.unread:hover { background: #dbeafe; }
  .notif-msg { font-size: 13px; color: var(--text); line-height: 1.4; }
  .notif-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  /* ─── SURAT DETAIL ─── */
  .surat-detail-row {
    display: flex;
    gap: 4px;
    padding: 8px 0;
    border-bottom: 1px solid #f1f5f9;
    font-size: 13px;
  }
  .surat-detail-row:last-child { border-bottom: none; }
  .surat-detail-label {
    width: 130px;
    flex-shrink: 0;
    font-weight: 600;
    color: var(--text-muted);
  }
  .surat-detail-value { flex: 1; color: var(--text); }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 768px) {
    .sidebar { width: 60px; overflow: hidden; }
    .sidebar-brand .brand-sub,
    .sidebar-user .user-name,
    .sidebar-user .user-role,
    .nav-item span,
    .nav-badge,
    .nav-label,
    .btn-logout span { display: none; }
    .sidebar-user { padding: 10px; }
    .sidebar-user .user-avatar { margin-bottom: 0; }
    .nav-item { justify-content: center; padding: 12px; }
